<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{titulo_retorno}} — WillPDV</title>
  <meta name="description" content="{{mensagem_retorno}}">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102322">
  <link rel="stylesheet" href="/site/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/site/#inicio"><span class="logo" aria-hidden="true">W</span>WillPDV</a>
    <nav aria-label="Seções">
      <a href="/site/#edicoes">Programas</a>
      <a href="/site/#planos">Planos</a>
      <a href="/site/#servicos">Serviços</a>
      <a href="/site/#faq">Dúvidas</a>
    </nav>
    <a class="botao pequeno" href="/site/#teste">Testar grátis</a>
  </header>

  <main>
    <article class="documento">
      <p class="olho">WillPDV</p>
      <h1>{{titulo_retorno}}</h1>
      <p class="lead">{{mensagem_retorno}}</p>
      {{extra_retorno}}
      <div class="acoes">
        <a class="botao" href="/site/#planos">Ver planos</a>
        <a class="zap" href="{{zap_contato}}">Chamar no WhatsApp</a>
      </div>
    </article>
  </main>

  <footer>
    <a class="marca" href="/site/#inicio"><span class="logo" aria-hidden="true">W</span>WillPDV</a>
    <p>WillPDV {{versao}} · WB SISTEMAS · <span class="telefone">{{telefone}}</span></p>
    <nav class="rodape-docs" aria-label="Documentos">
      <a href="/site/termos">Termos de Uso</a>
      <a href="/site/privacidade">Política de Privacidade</a>
    </nav>
    <a class="zap" href="{{zap_contato}}">Chamar no WhatsApp</a>
  </footer>
  <a class="zap fixo" href="{{zap_contato}}" aria-label="Chamar no WhatsApp">

    <span>WhatsApp</span>

</body>
</html>
