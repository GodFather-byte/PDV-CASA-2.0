# Roda a suíte inteira em PRs para main, após push na main ou por execução manual (mudança só em docs/.ai/*.md não roda).
# Sem runner próprio (repositório privado): PR = Linux inteiro + 2 trabalhos curtos de Windows + PostgreSQL;
# merge = só a suíte inteira no Windows 3.12. Cada minuto de Windows conta em dobro na cota.
# Windows é onde o PDV roda nas lojas; o Linux pega o que depende de sistema operacional sem querer.
# Com runner próprio (repositório privado e a variável RUNNER_PC, ex.: ["self-hosted","Windows"]): TUDO roda no PC do
# dono, sem gastar minutos do GitHub: no PR, a suíte inteira no Windows 3.12 (ela já contém os trabalhos curtos, e as
# cobranças rodam em SQLite); o Linux e o PostgreSQL ficam de fora. Sem RUNNER_PC, como abaixo, no GitHub. Em repositório público o
# runner próprio NUNCA é usado: qualquer PR de fora rodaria código no PC. Ver docs/PROTEGER_CODIGO.md.
name: Testes

on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", ".ai/**", "**/*.md"]      # mudança só de texto não roda teste
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".ai/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Economia de minutos (repositório privado): um push novo no mesmo PR cancela a rodada anterior, que ia ser jogada fora.
concurrency:
  group: testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tutorial-windows:
    name: Tutorial e telas mínimas / Windows
    # já rodou no PR; depois do merge basta a suíte inteira. Com o PC, a suíte inteira já cobre.
    if: github.event_name != 'push' && !(github.event.repository.private && vars.RUNNER_PC)
    runs-on: ${{ github.event.repository.private && vars.RUNNER_PC && fromJSON(vars.RUNNER_PC) || 'windows-latest' }}
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt -r backend/requirements.txt -r requirements-test.txt
      - run: python -m unittest tests.test_tutorial_guiado tests.test_operacao_responsiva tests.test_primeiros_passos

  publicacao-windows:
    name: Publicação assinada / Windows
    if: github.event_name != 'push' && !(github.event.repository.private && vars.RUNNER_PC)
    runs-on: ${{ github.event.repository.private && vars.RUNNER_PC && fromJSON(vars.RUNNER_PC) || 'windows-latest' }}
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt -r backend/requirements.txt -r requirements-test.txt
      - run: python -m unittest tests.test_servico_atualizacao tests.test_qt_app.TestAppQt.test_ciclo_arquivo_faz_backups_e_para_servicos tests.test_retomada_atualizacao tests.test_atualizacao_cmd_windows tests.test_publicar_atualizacao tests.test_atualizacao_automatica tests.test_qt_atualizacoes tests.test_empacotamento tests.test_modernizacao_integracao

  cobrancas-postgres:
    name: Mercado Pago / PostgreSQL 16
    # Precisa do contêiner do PostgreSQL (só no Linux do GitHub): com o PC, as mesmas regras rodam em SQLite na suíte.
    if: github.event_name != 'push' && !(github.event.repository.private && vars.RUNNER_PC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdv_teste
          POSTGRES_PASSWORD: senha_apenas_ci
          POSTGRES_DB: pdv_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdv_teste -d pdv_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PDV_TESTE_NUVEM_DB_URL: postgresql+psycopg://pdv_teste:senha_apenas_ci@localhost:5432/pdv_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.txt -r requirements-test.txt
      - name: Inbox, concorrência, retentativas e reinício (PostgreSQL e SQLite)
        run: python -m unittest tests.test_central_fornecedor tests.test_ponte_backend tests.test_cobrancas_mercadopago tests.test_painel_dono tests.test_painel_melhorias

  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    # Com o PC, a suíte inteira roda no PR; depois do merge não repete (o PC fica livre para o próximo PR).
    if: ${{ !(github.event.repository.private && vars.RUNNER_PC && github.event_name == 'push') }}
    runs-on: ${{ matrix.os == 'windows-latest' && (github.event.repository.private && vars.RUNNER_PC && fromJSON(vars.RUNNER_PC) || 'windows-latest') || matrix.os }}
    timeout-minutes: 60          # o PC do dono é mais lento; o tools.rodar_testes já encerra módulo travado (15 min)
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        # Windows (onde o PDV roda) nas duas versões; Linux só na mais nova: o 3.10 já é coberto no Windows e cada
        # minuto de Linux conta na cota do repositório privado.
        # Privado SEM runner próprio: cada minuto de Windows do GitHub conta em dobro. Aí o PR roda só o Linux (mais os
        # dois trabalhos curtos de Windows acima) e a suíte inteira no Windows roda uma vez, no 3.12, depois do merge.
        # Depois do merge (push na main) o Linux não repete: o PR já rodou a suíte inteira nele.
        include: ${{ fromJSON(
          (github.event.repository.private && vars.RUNNER_PC)
            && '[{"os":"windows-latest","python":"3.12"}]'
          || (github.event.repository.private && !vars.RUNNER_PC && github.event_name == 'pull_request')
            && '[{"os":"ubuntu-latest","python":"3.12"}]'
          || (github.event.repository.private && !vars.RUNNER_PC && github.event_name == 'push')
            && '[{"os":"windows-latest","python":"3.12"}]'
          || (github.event.repository.private && !vars.RUNNER_PC)
            && '[{"os":"windows-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.12"}]'
          || '[{"os":"windows-latest","python":"3.10"},{"os":"windows-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.12"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4          # o runner próprio (PC do dono) não vem com Node
        with:
          node-version: "20"
      - name: Dependências (opcionais do PDV e da API, para nada ficar pulado)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r backend/requirements.txt -r requirements-test.txt
          python -c "from fastapi.testclient import TestClient; import sqlalchemy, psycopg, PySide6"
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        # Um processo por módulo, em paralelo, com limite por módulo: no PC do dono a suíte em série passa de 30 min
        # e um teste travado só aparecia como silêncio. Aqui sai o tempo de cada módulo e o nome do que travou.
        run: python -m tools.rodar_testes --limite 900
      - name: Instalação da PWA do porteiro (iPhone, iPad e Android)
        run: node --test tests/test_porteiro_instalacao.cjs tests/test_pdf_painel.cjs
      - name: Testes (Linux, telas num X virtual)
        if: runner.os == 'Linux'
        # 24 bits de cor: com a tela padrão do xvfb-run (8 bits) o Tk (gerador de licenças) cai com segmentation fault.
        run: |
          instalar() { sudo apt-get update -q && sudo apt-get install -y -q xvfb python3-tk libegl1 libopengl0; }
          # Os servidores do Ubuntu às vezes somem para o runner ("Temporary failure resolving archive.ubuntu.com").
          # Nesse caso troca para o espelho do kernel.org e tenta mais uma vez, em vez de falhar sem rodar teste nenhum.
          instalar || {
            echo "::warning::Servidores de pacotes do Ubuntu fora do ar; usando o espelho mirrors.edge.kernel.org."
            echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sudo sed -i -E 's#https?://(security|archive|azure\.archive)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            instalar
          }
          # -X faulthandler: se o Tk/Qt cair, o log mostra em qual teste (sem isso só aparece "Segmentation fault")
          xvfb-run -a -s "-screen 0 1920x1080x24" python -X faulthandler -m unittest discover -s tests
