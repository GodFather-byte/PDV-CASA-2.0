# Nuvem (backend/ + painel do dono): testa e, se passar, aciona o deploy no Render.
# O Actions NÃO hospeda a nuvem (um job dura no máximo horas): quem fica no ar é o Render ou o servidor próprio
# (docs/NUVEM.md). Usa o Deploy Hook quando configurado ou aguarda a integração Git do Render.
# Só confirma sucesso quando /v1/versao serve o commit esperado. Guia: docs/ENTREGA_1_10.md.
name: "Nuvem: testar e publicar"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - "tests/test_painel_*.py"
      - "tests/test_nuvem.py"
      - "tests/test_cardapio.py"
      - "render.yaml"
      - "requirements*.txt"
      - "tools/verificar_nuvem.py"
      - ".github/workflows/nuvem-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvem-deploy
  cancel-in-progress: false

jobs:
  testar:
    name: Testes da nuvem (API, painel do dono e envio do PDV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.txt -r requirements-test.txt
      - name: API, painel do dono e laço de sincronização
        run: python -m unittest tests.test_painel_dono tests.test_painel_caixas tests.test_painel_limpeza tests.test_painel_senha_pdv tests.test_painel_melhorias tests.test_painel_bar tests.test_verificar_nuvem tests.test_nuvem tests.test_cardapio
      - name: App web (manifesto válido e arquivos no lugar)
        run: |
          python -m json.tool backend/painel_web/manifest.webmanifest > /dev/null
          python -m json.tool backend/cardapio_web/manifest.webmanifest > /dev/null
          test -f backend/cardapio_web/index.html && test -f backend/cardapio_web/app.js
          test -f backend/painel_web/index.html && test -f backend/painel_web/app.js && test -f backend/painel_web/sw.js
          test -f backend/painel_web/icones/icone-192.png && test -f backend/painel_web/icones/icone-512.png

  publicar:
    name: Deploy no Render
    needs: testar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acionar o Deploy Hook (se configurado)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sem Deploy Hook: aguardando a publicação automática pelo Git no Render."
            exit 0
          fi
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Render respondeu HTTP $codigo"
          case "$codigo" in 2*) ;; *) echo "Deploy Hook falhou"; exit 1;; esac
      - name: Confirmar o commit publicado na nuvem
        env:
          NUVEM_URL: ${{ vars.PDV_NUVEM_URL || 'https://willpdv-nuvem-6sp0.onrender.com' }}
        run: python -m tools.verificar_nuvem --url "$NUVEM_URL" --commit "$GITHUB_SHA" --timeout 300
