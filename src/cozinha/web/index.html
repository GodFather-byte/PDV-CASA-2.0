<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101c20">
<title>Cozinha — Will Restaurante</title><link rel="stylesheet" href="estilo.css"><script src="app.js" defer></script></head>
<body>
<header class="topo"><div class="barra">
  <div class="marca"><span class="icone-cozinha" aria-hidden="true"></span>Will Restaurante <span class="modulo">Cozinha</span></div>
  <div class="acoes"><button id="tela-cheia" type="button">Tela cheia</button><button id="sair" type="button" hidden>Sair</button></div>
</div></header>
<form id="login"><h1>Entrar na cozinha</h1><p>Use o PIN definido no caixa em Cozinha/Bar → Tablet / TV.</p><label>PIN da cozinha
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" required autocomplete="current-password"></label>
<button id="entrar" type="submit">Entrar</button></form>
<p id="aviso" role="status" aria-live="polite"></p>
<main id="painel" hidden>
<div class="cabecalho"><div><div class="titulo"><h1>Fila de preparo</h1><span id="contagem" aria-label="Itens na fila"></span></div><span id="modo"></span></div>
<label class="filtro">Setor <select id="setor"><option value="">Todos</option></select></label></div>
<p id="atualizado"></p>
<p id="vazio" hidden>Nenhum item aguardando neste setor.</p><section id="fila" aria-label="Fila de preparo"></section></main>
</body></html>
