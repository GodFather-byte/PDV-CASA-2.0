# Nuvem do WillPDV no Render. Passo a passo em docs/NUVEM.md ("Render + Neon") e, para a cobrança,
# em docs/COBRANCA_LICENCAS_ASAAS.md.
# O banco NÃO fica no Render: ele fica num PostgreSQL do Neon (neon.tech), informado em PDV_NUVEM_DB_URL.
# Plano "starter" = instância paga sempre ligada (o plano "free" dorme após 15 min e não serve para webhook).
# Confira o preço atual em render.com/pricing. Para testar de graça, troque para "free" só no ambiente de teste.
# O worker NÃO é um serviço do Render aqui: roda como agendador no GitHub Actions
# (.github/workflows/worker-asaas.yml). Para usar um Background Worker do Render, veja a seção 11 do guia.
services:
  - type: web
    name: willpdv-nuvem
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TZ                       # datas da nuvem no horário do Brasil (datas da licença)
        value: America/Sao_Paulo
      - key: PDV_API_TOKEN            # sua senha de administrador: o Render gera uma; veja em Environment
        generateValue: true
      - key: PDV_NUVEM_DB_URL         # cole o endereço do banco do Neon (postgresql://...)
        sync: false
      - key: PDV_LICENCA_CHAVE        # arquivo secreto (Secret File) com a chave da licença
        value: /etc/secrets/licenca_privada.key
      - key: ASAAS_AMBIENTE           # sandbox (testes) ou producao, preenchido no painel (sem valor aqui, para uma
        sync: false                   # sincronização do Blueprint nunca desfazer a virada); sem valor, o padrão é sandbox
      - key: ASAAS_API_KEY            # chave do Asaas do ambiente acima; preencha no painel
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN      # segredo do webhook (o mesmo cadastrado no Asaas); preencha no painel
        sync: false
