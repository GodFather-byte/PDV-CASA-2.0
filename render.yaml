# Nuvem do WillPDV no Render (plano gratuito). Passo a passo em docs/NUVEM.md, "Opção grátis: Render + Neon".
# O banco NÃO fica no Render: o disco do plano grátis é apagado a cada reinício. Os dados ficam num PostgreSQL
# gratuito do Neon (neon.tech), informado em PDV_NUVEM_DB_URL.
# Cobrança Mercado Pago: docs/COBRANCA_LICENCAS_MERCADOPAGO.md.
# O webhook e a varredura rodam neste serviço web (não há worker separado).
# Cole MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET no painel do Render. Não commite esses valores.
services:
  - type: web
    name: willpdv-nuvem
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install --require-hashes -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TZ                       # datas da nuvem no horário do Brasil (datas da licença)
        value: America/Sao_Paulo
      - key: PDV_API_TOKEN            # sua senha de administrador: o Render gera uma; veja em Environment
        generateValue: true
      - key: PDV_NUVEM_DB_URL         # cole o endereço do banco do Neon (postgresql://...)
        sync: false
      - key: PDV_LICENCA_CHAVE        # arquivo secreto (Secret File) com a chave da licença
        value: /etc/secrets/licenca_privada.key
      - key: MP_ACCESS_TOKEN         # Access Token do Mercado Pago (teste começa com TEST-). Não commitar.
        sync: false
      - key: MP_WEBHOOK_SECRET       # Assinatura secreta de Suas integrações > Webhooks. Não commitar.
        sync: false
      - key: MP_BOLETO_METODO        # opcional; padrão bolbradesco. Outro código de boleto da conta, se o painel exigir.
        value: bolbradesco
      - key: BREVO_API_KEY           # E-mail por HTTPS. O Render grátis bloqueia SMTP. Não commitar.
        sync: false
      - key: EMAIL_FROM              # Remetente verificado na Brevo (pode ser um Gmail).
        sync: false
      - key: EMAIL_FROM_NAME         # Opcional. Nome que aparece no e-mail.
        sync: false
      - key: SMTP_HOST               # Reserva, só sem BREVO_API_KEY. O plano grátis não abre esta porta.
        sync: false
      - key: SMTP_PORT               # 587 (STARTTLS) ou 465 (SSL).
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD           # no Gmail, senha de app. Não commitar.
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_API_URL        # https do bot. Vazio = o painel mostra um link wa.me.
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
